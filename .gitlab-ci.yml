# Only job here: create the GitLab release that publishes the CI/CD Catalog component.
# Runs on the gitlab.com mirror; see docs/maintainers/release.md.
stages: [release]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  # The Catalog takes semantic versions (`1.0.0`, not `v1.0.0`), so the release goes under the tag without its `v`;
  # GitLab creates that tag at this commit. `release:` runs as a glab command in the job shell, which expands
  # `${CI_COMMIT_TAG#v}`. The new tag does not match the rule above, so it starts no second release.
  release:
    tag_name: ${CI_COMMIT_TAG#v}
    description: "reviewloop $CI_COMMIT_TAG. See CHANGELOG.md."
