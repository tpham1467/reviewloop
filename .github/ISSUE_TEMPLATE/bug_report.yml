name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: reviewloop version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Code host
      options: [GitHub, GitLab, Bitbucket, Local]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens and private code before pasting.
      render: text
