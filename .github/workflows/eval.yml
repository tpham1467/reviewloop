name: eval

on:
  push:
    branches-ignore: [main]
    paths:
      - "src/reviewloop/skills/**"
      - "src/reviewloop/rules/**"
      - "eval/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    # Pushes to branches of this repository only: a fork cannot push here, and the job needs a model credential.
    if: github.repository == 'tpham1467/reviewloop'
    # The `eval` environment holds ANTHROPIC_API_KEY; maintainers can require reviewers on it in repository settings.
    environment: eval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check for an agent credential
        id: credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::eval skipped because no agent credential is configured (secret ANTHROPIC_API_KEY in the eval environment)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credential.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.credential.outputs.run == 'true'
      - run: uv sync --frozen
        if: steps.credential.outputs.run == 'true'
      - name: Install the agent CLI
        if: steps.credential.outputs.run == 'true'
        run: npm install --global @anthropic-ai/claude-code@2.1.332
      - name: Run the eval
        if: steps.credential.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          check=()
          if [ -f eval/baseline.json ]; then check=(--check eval/baseline.json); fi
          uv run python eval/run.py --aacr 20 --out eval-metrics.json "${check[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.credential.outputs.run == 'true'
        with:
          name: eval-metrics
          path: eval-metrics.json
          if-no-files-found: ignore
