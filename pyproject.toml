[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewloop"
version = "0.0.0"
description = "AI code review in your own CI with your own agent CLI (Claude Code, Codex or Cursor) for GitHub, GitLab and Bitbucket."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "tpham1467" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6",
  "PyGithub>=2.3",
  "python-gitlab>=4.6",
  "atlassian-python-api>=3.41",
  "httpx>=0.27",
]

[project.scripts]
reviewloop = "reviewloop.cli:app"

[project.urls]
Homepage = "https://github.com/tpham1467/reviewloop"
Issues = "https://github.com/tpham1467/reviewloop/issues"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-timeout",
  "ruff",
  "pyright",
  "pre-commit",
  "jsonschema",
  "types-PyYAML",
  "mkdocs-material",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reviewloop"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=reviewloop --cov-report=term-missing"

[tool.coverage.report]
fail_under = 85
